<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARC — Agency Religious Codex</title>
<link rel="stylesheet" href="app.css">
</head>
<body data-theme="light" data-font="serif" data-layout="columns">

<header id="topbar">
  <button id="btn-library" class="icon-btn" title="Library" aria-label="Open library">☰</button>
  <div id="crumb">
    <span id="brand">ARC</span>
    <span id="crumb-tradition"></span>
    <span id="crumb-work" class="crumb-work"></span>
    <span id="crumb-unit"></span>
  </div>
  <form id="ref-form" autocomplete="off">
    <input id="ref-input" type="text" placeholder="Go to reference…" aria-label="Go to reference">
  </form>
  <button id="btn-search" class="icon-btn" title="Search" aria-label="Search">⌕</button>
  <button id="btn-settings" class="icon-btn" title="Display settings" aria-label="Display settings">Aa</button>
</header>

<aside id="library" class="panel" hidden>
  <div class="panel-head">
    <h2>Library</h2>
    <button class="icon-btn close" data-close="library" aria-label="Close">×</button>
  </div>
  <div id="library-body"></div>
</aside>

<aside id="search" class="panel" hidden>
  <div class="panel-head">
    <h2>Search</h2>
    <button class="icon-btn close" data-close="search" aria-label="Close">×</button>
  </div>
  <form id="search-form" autocomplete="off">
    <input id="search-input" type="search" placeholder="Search words…" aria-label="Search words">
    <label class="scope"><select id="search-scope"></select></label>
  </form>
  <div id="search-status" class="muted"></div>
  <ol id="search-results"></ol>
</aside>

<aside id="settings" class="panel" hidden>
  <div class="panel-head">
    <h2>Display</h2>
    <button class="icon-btn close" data-close="settings" aria-label="Close">×</button>
  </div>
  <div class="settings-body">
    <fieldset>
      <legend>Theme</legend>
      <label><input type="radio" name="theme" value="light"> Light</label>
      <label><input type="radio" name="theme" value="sepia"> Sepia</label>
      <label><input type="radio" name="theme" value="dark"> Dark</label>
    </fieldset>
    <fieldset>
      <legend>Font</legend>
      <label><input type="radio" name="font" value="serif"> Serif</label>
      <label><input type="radio" name="font" value="sans"> Sans-serif</label>
      <label><input type="radio" name="font" value="system"> System</label>
    </fieldset>
    <fieldset>
      <legend>Size <output id="size-out"></output></legend>
      <input type="range" id="size" min="14" max="30" step="1">
    </fieldset>
    <fieldset>
      <legend>Line spacing <output id="leading-out"></output></legend>
      <input type="range" id="leading" min="1.3" max="2.2" step="0.1">
    </fieldset>
    <fieldset>
      <legend>Comparison layout</legend>
      <label><input type="radio" name="layout" value="columns"> Side by side</label>
      <label><input type="radio" name="layout" value="interleaved"> Verse by verse</label>
    </fieldset>
    <fieldset>
      <legend>Numbers</legend>
      <label><input type="checkbox" id="show-numbers"> Show verse numbers</label>
      <label><input type="checkbox" id="show-footnotes"> Show footnotes</label>
    </fieldset>
  </div>
</aside>

<main id="main">
  <section id="work-head" hidden>
    <div id="work-title"></div>
    <div id="work-editions"></div>
  </section>
  <nav id="unit-nav" hidden>
    <button id="btn-prev" class="nav-btn" aria-label="Previous">‹</button>
    <button id="btn-toc" class="nav-btn toc-btn">Contents</button>
    <button id="btn-today" class="nav-btn" hidden>Today</button>
    <button id="btn-next" class="nav-btn" aria-label="Next">›</button>
  </nav>
  <div id="toc" class="toc" hidden></div>
  <div id="reader"></div>
  <div id="welcome">
    <h1>ARC</h1>
    <p class="tagline">Agency Religious Codex</p>
    <p>Choose a tradition from the library to begin.</p>
    <button id="btn-welcome-library" class="primary">Open library</button>
  </div>
</main>

<nav id="float-nav" hidden aria-label="Previous and next">
  <button id="btn-prev-f" class="float-btn" aria-label="Previous">‹</button>
  <button id="btn-top-f" class="float-btn" aria-label="Back to top" title="Back to top">↑</button>
  <button id="btn-next-f" class="float-btn" aria-label="Next">›</button>
</nav>

<div id="backdrop" hidden></div>

<script type="text/plain" data-web="data/"></script>
<!--BUILD:JS--><script src="app.js"></script><!--/BUILD:JS-->
</body>
</html>
